<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot Soccer Controller - Flechas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Teko:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
        }
        .font-tech { font-family: 'Rajdhani', sans-serif; }
        .font-display { font-family: 'Teko', sans-serif; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .arrow-btn {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
            transition: all 0.1s ease-in-out;
        }

        .arrow-btn:active, .arrow-btn.active-key {
            transform: scale(0.92);
            background: rgba(59, 130, 246, 0.4);
            border-color: rgba(96, 165, 250, 0.8);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        }

        .glow-red {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
        }
    </style>
</head>
<body class="h-full w-full flex flex-col justify-between p-3 sm:p-5 bg-slate-950 text-slate-100">

    <!-- TOP HEADER: Status, Selector & Quick Actions -->
    <header class="w-full glass-panel rounded-2xl p-3 flex justify-between items-center z-20">
        <!-- Team Selector & Connection -->
        <div class="flex items-center gap-2 sm:gap-3">
            <button id="team-btn" onclick="toggleTeam()" class="flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-bold font-tech uppercase border border-blue-500/40 bg-blue-950/60 text-blue-400">
                <span id="team-dot" class="w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_8px_#3b82f6]"></span>
                <span id="team-name">EQUIPO AZUL</span>
            </button>

            <!-- Connection Status -->
            <div id="conn-badge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-emerald-950/50 border border-emerald-500/30 text-emerald-400 text-xs font-tech">
                <span id="conn-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="conn-text" class="hidden sm:inline font-bold">ONLINE</span>
            </div>
        </div>

        <!-- Battery & RSSI Telemetry -->
        <div class="flex items-center gap-3 font-tech text-xs">
            <div class="flex items-center gap-1.5 bg-slate-900/90 px-3 py-1.5 rounded-xl border border-slate-800">
                <i class="fa-solid fa-battery-three-quarters text-emerald-400"></i>
                <span class="font-bold text-slate-200">88%</span>
            </div>
            <div class="hidden md:flex items-center gap-1.5 bg-slate-900/90 px-3 py-1.5 rounded-xl border border-slate-800">
                <i class="fa-solid fa-wifi text-blue-400"></i>
                <span class="text-slate-300">-58 dBm</span>
            </div>
        </div>

        <!-- Controls: QR Code & Config -->
        <div class="flex items-center gap-2">
            <button onclick="openModal('qr-modal')" class="arrow-btn p-2.5 rounded-xl text-slate-200 hover:text-white">
                <i class="fa-solid fa-qrcode text-base"></i>
            </button>
            <button onclick="openModal('config-modal')" class="arrow-btn p-2.5 rounded-xl text-slate-200 hover:text-white">
                <i class="fa-solid fa-sliders text-base"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTROL AREA: Directional Arrow D-Pad + Speed Bar -->
    <main class="w-full flex-1 my-3 flex flex-col lg:flex-row items-center justify-center gap-6 relative z-10">
        
        <!-- LEFT/CENTER: Large Arrow D-Pad -->
        <section class="flex flex-col items-center justify-center">
            <div class="grid grid-cols-3 gap-3 w-64 h-64 sm:w-80 sm:h-80 p-3 glass-panel rounded-3xl border border-slate-700/80 shadow-2xl">
                
                <!-- TOP ROW: UP -->
                <div></div>
                <button id="btn-UP" 
                    onmousedown="pressDirection('ARRIBA')" onmouseup="releaseDirection()"
                    ontouchstart="pressDirection('ARRIBA')" ontouchend="releaseDirection()"
                    class="arrow-btn rounded-2xl flex flex-col items-center justify-center text-blue-400 active:text-white">
                    <i class="fa-solid fa-arrow-up text-3xl sm:text-4xl"></i>
                    <span class="text-[10px] font-tech font-bold tracking-widest text-slate-400 mt-1">AVANZAR</span>
                </button>
                <div></div>

                <!-- MIDDLE ROW: LEFT, STOP, RIGHT -->
                <button id="btn-LEFT" 
                    onmousedown="pressDirection('IZQUIERDA')" onmouseup="releaseDirection()"
                    ontouchstart="pressDirection('IZQUIERDA')" ontouchend="releaseDirection()"
                    class="arrow-btn rounded-2xl flex flex-col items-center justify-center text-blue-400 active:text-white">
                    <i class="fa-solid fa-arrow-left text-3xl sm:text-4xl"></i>
                    <span class="text-[10px] font-tech font-bold tracking-widest text-slate-400 mt-1">GIRO IZQ</span>
                </button>

                <!-- Emergency STOP in Center of D-Pad -->
                <button onclick="emergencyStop()" 
                    class="bg-red-600 hover:bg-red-500 active:scale-90 text-white rounded-2xl flex flex-col items-center justify-center glow-red border-2 border-red-400 transition-transform">
                    <i class="fa-solid fa-octagon-xmark text-2xl sm:text-3xl"></i>
                    <span class="text-[11px] font-tech font-black tracking-widest mt-1">STOP</span>
                </button>

                <button id="btn-RIGHT" 
                    onmousedown="pressDirection('DERECHA')" onmouseup="releaseDirection()"
                    ontouchstart="pressDirection('DERECHA')" ontouchend="releaseDirection()"
                    class="arrow-btn rounded-2xl flex flex-col items-center justify-center text-blue-400 active:text-white">
                    <i class="fa-solid fa-arrow-right text-3xl sm:text-4xl"></i>
                    <span class="text-[10px] font-tech font-bold tracking-widest text-slate-400 mt-1">GIRO DER</span>
                </button>

                <!-- BOTTOM ROW: DOWN -->
                <div></div>
                <button id="btn-DOWN" 
                    onmousedown="pressDirection('ABAJO')" onmouseup="releaseDirection()"
                    ontouchstart="pressDirection('ABAJO')" ontouchend="releaseDirection()"
                    class="arrow-btn rounded-2xl flex flex-col items-center justify-center text-blue-400 active:text-white">
                    <i class="fa-solid fa-arrow-down text-3xl sm:text-4xl"></i>
                    <span class="text-[10px] font-tech font-bold tracking-widest text-slate-400 mt-1">RETROCEDER</span>
                </button>
                <div></div>

            </div>
        </section>

        <!-- RIGHT: Speed Selector & Emergency Panel -->
        <section class="w-full max-w-xs glass-panel p-4 rounded-2xl border border-slate-800 flex flex-col gap-4 font-tech">
            <div class="text-xs text-slate-400 uppercase tracking-wider font-bold flex justify-between items-center border-b border-slate-800 pb-2">
                <span><i class="fa-solid fa-gauge-high text-cyan-400 mr-1"></i> Control de Velocidad</span>
                <span id="speed-display" class="text-cyan-400 font-mono text-sm font-bold">100%</span>
            </div>

            <!-- Quick Speed Buttons -->
            <div class="grid grid-cols-4 gap-1.5">
                <button onclick="setSpeed(25)" class="arrow-btn py-2 rounded-xl text-xs font-bold text-slate-300">25%</button>
                <button onclick="setSpeed(50)" class="arrow-btn py-2 rounded-xl text-xs font-bold text-slate-300">50%</button>
                <button onclick="setSpeed(75)" class="arrow-btn py-2 rounded-xl text-xs font-bold text-slate-300">75%</button>
                <button onclick="setSpeed(100)" class="arrow-btn py-2 rounded-xl text-xs font-bold text-cyan-400 border-cyan-500/50">100%</button>
            </div>

            <!-- Slider Range -->
            <input type="range" id="speed-slider" min="10" max="100" value="100" oninput="setSpeed(this.value)" class="w-full accent-cyan-400">

            <!-- Big Emergency Stop Button -->
            <button onclick="emergencyStop()" class="w-full py-3 bg-red-600 hover:bg-red-500 active:scale-95 text-white rounded-xl font-black text-sm tracking-widest glow-red flex items-center justify-center gap-2 mt-1">
                <i class="fa-solid fa-hand"></i> PARO DE EMERGENCIA
            </button>
        </section>

    </main>

    <!-- FOOTER: Telemetry & Command Log -->
    <footer class="w-full glass-panel rounded-2xl px-4 py-2.5 flex justify-between items-center text-xs font-tech text-slate-400 z-20">
        <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
            <span>Comando Activo: <strong id="log-command" class="text-slate-100 font-mono">PARADO</strong></span>
        </div>
        <div id="protocol-type" class="text-slate-500 font-mono hidden sm:block">WS: ws://192.168.4.1:81</div>
    </footer>

    <!-- CONFIG MODAL -->
    <div id="config-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 border border-slate-700 flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-tech font-bold text-white"><i class="fa-solid fa-wifi text-blue-400 mr-2"></i>Conexión del Robot</h3>
                <button onclick="closeModal('config-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-3 font-tech text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Protocolo</label>
                    <select id="protocol-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white">
                        <option value="websocket">WebSocket (ESP32 / Wi-Fi)</option>
                        <option value="ble">Web Bluetooth (BLE)</option>
                        <option value="simulated">Modo Prueba (Simulado)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">IP del Servidor WebSocket</label>
                    <input type="text" id="robot-ip" value="192.168.4.1:81" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono">
                </div>
            </div>

            <button onclick="saveSettings()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-tech font-bold py-2.5 rounded-xl shadow-lg mt-2">
                GUARDAR CONFIGURACIÓN
            </button>
        </div>
    </div>

    <!-- QR MODAL -->
    <div id="qr-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 border border-slate-700 flex flex-col items-center gap-4 text-center">
            <div class="flex justify-between items-center w-full border-b border-slate-800 pb-2">
                <h3 class="text-base font-tech font-bold text-white">Escanea para Abrir en tu Celular</h3>
                <button onclick="closeModal('qr-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="qrcode-container" class="bg-white p-3 rounded-2xl border border-slate-300"></div>
            <p class="text-xs text-slate-400 font-tech">Abre la cámara de tu teléfono iPhone o Android para tomar el control del robot inmediatamente.</p>
        </div>
    </div>

    <script>
        let currentDirection = 'STOP';
        let speed = 100;
        let team = 'blue';
        let ws = null;

        window.addEventListener('DOMContentLoaded', () => {
            generateQRCode();
            setupKeyboardControls();
        });

        // Direction Arrow Press / Release Logic
        function pressDirection(dir) {
            currentDirection = dir;
            highlightButton(dir, true);
            vibrate(40);
            sendCmd(`MOVE:${dir}:${speed}`);
        }

        function releaseDirection() {
            if (currentDirection !== 'STOP') {
                highlightButton(currentDirection, false);
                currentDirection = 'STOP';
                sendCmd('MOVE:STOP:0');
            }
        }

        function emergencyStop() {
            releaseDirection();
            vibrate([80, 40, 80]);
            sendCmd('EMERGENCY_STOP');
        }

        function setSpeed(val) {
            speed = val;
            document.getElementById('speed-display').innerText = `${val}%`;
            document.getElementById('speed-slider').value = val;
            vibrate(30);
            sendCmd(`SET_SPEED:${speed}`);
        }

        // Team Toggle (Blue vs Yellow)
        function toggleTeam() {
            const btn = document.getElementById('team-btn');
            const dot = document.getElementById('team-dot');
            const name = document.getElementById('team-name');

            if (team === 'blue') {
                team = 'yellow';
                btn.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-bold font-tech uppercase border border-amber-500/40 bg-amber-950/60 text-amber-400";
                dot.className = "w-3 h-3 rounded-full bg-amber-400 shadow-[0_0_8px_#f59e0b]";
                name.innerText = "EQUIPO AMARILLO";
            } else {
                team = 'blue';
                btn.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-bold font-tech uppercase border border-blue-500/40 bg-blue-950/60 text-blue-400";
                dot.className = "w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_8px_#3b82f6]";
                name.innerText = "EQUIPO AZUL";
            }
            vibrate(50);
            sendCmd(`TEAM:${team.toUpperCase()}`);
        }

        // Keyboard Controls (PC Arrow Keys & Spacebar)
        function setupKeyboardControls() {
            const keyMap = {
                'ArrowUp': 'ARRIBA',
                'ArrowDown': 'ABAJO',
                'ArrowLeft': 'IZQUIERDA',
                'ArrowRight': 'DERECHA'
            };

            window.addEventListener('keydown', (e) => {
                if (e.repeat) return;
                if (e.code === 'Space') {
                    emergencyStop();
                } else if (keyMap[e.code] && currentDirection !== keyMap[e.code]) {
                    pressDirection(keyMap[e.code]);
                }
            });

            window.addEventListener('keyup', (e) => {
                if (keyMap[e.code] && currentDirection === keyMap[e.code]) {
                    releaseDirection();
                }
            });
        }

        function highlightButton(dir, active) {
            const dirToId = { 'ARRIBA': 'btn-UP', 'ABAJO': 'btn-DOWN', 'IZQUIERDA': 'btn-LEFT', 'DERECHA': 'btn-RIGHT' };
            const btn = document.getElementById(dirToId[dir]);
            if (btn) {
                if (active) btn.classList.add('active-key');
                else btn.classList.remove('active-key');
            }
        }

        function sendCmd(cmd) {
            document.getElementById('log-command').innerText = cmd;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(cmd);
            } else {
                console.log(`[ROBOT COMMAND]: ${cmd}`);
            }
        }

        function vibrate(ms) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        }

        function generateQRCode() {
            const container = document.getElementById('qrcode-container');
            container.innerHTML = '';
            new QRCode(container, {
                text: window.location.href,
                width: 150,
                height: 150,
                colorDark: "#0f172a",
                colorLight: "#ffffff"
            });
        }

        function saveSettings() {
            const ip = document.getElementById('robot-ip').value;
            const protocol = document.getElementById('protocol-select').value;
            document.getElementById('protocol-type').innerText = `${protocol.toUpperCase()}: ${ip}`;
            closeModal('config-modal');
        }
    </script>
</body>
</html>
